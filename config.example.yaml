# SHE v2 Agent Configuration
# Target deploy path: D:\AGI\she-v2

llm:
  provider: openai
  model: gpt-4o
  baseUrl: https://api.openai.com/v1
  maxTokens: 4096
  temperature: 0.3

workspace:
  root: "."

kb:
  dbPath: .she/kb.sqlite
  maxChildrenBeforeSplit: 12
  dormancyThresholdDays: 30
  activationBudget: 100
  boostOnAccess: 1.5
  pulseSeed:
    initialEnergy: 1.0
    decayRate: 0.3
    resonanceThreshold: 0.15
    maxHops: 6

sandbox:
  shell: auto
  timeout: 30000
  maxOutputBytes: 524288
  denyDestructiveByDefault: true

server:
  port: 4577
  host: 127.0.0.1
