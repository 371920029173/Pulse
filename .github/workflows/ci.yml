name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose.
      #
      # pnpm/action-setup@v4 FAILS when the action specifies a version and package.json also has a
      # `packageManager` field:
      #
      #   Error: Multiple versions of pnpm specified:
      #   - version 9 in the GitHub Action config with the key "version"
      #   - version pnpm@9.15.4 in the package.json with the key "packageManager"
      #
      # That is what the first run of this workflow did: it died on this step, so every check below
      # was skipped and the repo showed a red badge while nothing had actually been verified.
      # package.json is the single source of truth for the toolchain version.
      - uses: pnpm/action-setup@v4

      # Node 20 is deprecated on GitHub runners; 22 matches the version this is developed and
      # built against locally, so CI and development agree.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The whole offline gate, not a hand-picked subset.
      #
      # This used to run three checks out of twenty-one. The other eighteen — including the
      # security, stylesheet, restart and bundle checks — had never executed on Linux, while the
      # README stated the project works there. Anything that cannot run offline (the two evaluations
      # that call a model) is excluded by name inside `check:offline`, so what runs here is a stable,
      # documented set rather than whatever the workflow author remembered.
      #
      # Linux is also the only platform CI can exercise: the maintainer develops on Windows, so a
      # failure here is the first real signal that a platform branch is wrong.
      - name: Offline gate (build, tests, all offline checks)
        run: pnpm check:offline

      # Dependency advisories, as a ratchet: the count may fall, never rise.
      #
      # Deliberately a separate step. `check:offline` is offline by contract — no step in it
      # reaches the network — and `pnpm audit` queries the advisory database, so it cannot live
      # there without breaking the property that makes that gate's answer the same on CI and on a
      # developer's machine. (Folding it in would also silently invalidate the step count quoted
      # in docs/testing.md, which `check:docs` asserts.)
      #
      # This is the half that was missing when 104 advisories accumulated on the default branch:
      # Dependabot alerts tell you after the fact, and nothing was watching before it.
      - name: Dependency advisories (ratchet)
        run: pnpm check:deps


  # ── 平台：Linux 之外只做「能装、能建、能起、能答一句」的最小验证 ─────────────────────
  #
  # 这一段存在的理由不是覆盖率，而是 README 里那张表（Windows 11 / macOS 写着「从未实际运行过」）。
  # 一台没人跑过的平台，写的分支就只是猜测；这里让每次推送都在两个平台上真的起一次服务。
  #
  # 刻意**不**跑整套 check:offline（那是 ubuntu 那个 job 的事，也省 macOS 的额度）；跑的是三条
  # 分平台最有信号的：security-check（自己起服务、真实 HTTP、不需要 key）、check:lock（本地桩模型
  # 上跑完一轮对话，证明流式与轮次锁在这台机器上真的工作）、check:shell（cmd.exe 与 POSIX 的引号、
  # 方言披露正是分平台的代码路径）。
  platform-minimal:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm -r build
      - name: Boot a server and probe it over HTTP (no key needed)
        run: node scripts/security-check.mjs
      - name: One full turn against a local stub model (no key needed)
        run: pnpm check:lock
      - name: Shell quoting and dialect (the platform-specific paths)
        run: pnpm check:shell

  # ── 容器：Dockerfile 真的能构建，容器真的能起来说话 ────────────────────────────────
  #
  # `check:docker` 只看结构（.dockerignore、基础镜像、入口），它按设计不联网也不构建。
  # 那份静态检查加上这一个 job，「容器能用」才从声明变成事实。
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t pulse:ci .
      - name: Start it and ask /api/health
        run: |
          docker run -d --name pulse-ci -p 127.0.0.1:5577:5577 pulse:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5577/api/health >/dev/null; then
              echo "health ok after ${i}s"
              docker rm -f pulse-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "container never answered /api/health"; docker logs pulse-ci; exit 1