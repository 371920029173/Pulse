name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test

      # Retrieval eval runs against the bundled fixture library when no real
      # library is present, so it still asserts something in CI instead of
      # silently skipping. Offline: no API keys needed.
      - name: Retrieval eval
        run: node evals/retrieval/run.mjs

      # Verifies subagents cannot recurse and lose the tools that assume a human
      # is present. Offline.
      - name: Subagent wiring
        run: node scripts/check-subagent.mjs

      # Spins up the real server against throwaway workspaces to verify that
      # state recovery cannot overwrite existing data.
      - name: Data safety
        run: node scripts/data-safety-check.mjs

      # Verifies the local API refuses cross-site requests, foreign Host headers,
      # workspace escapes and symlink escapes. Needs a running server.
      - name: Security check
        env:
          SHE_WORKSPACE: ${{ github.workspace }}/sample-workspace
        run: |
          node packages/server/dist/index.js &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:4577/api/health >/dev/null && break
            sleep 1
          done
          node scripts/security-check.mjs
